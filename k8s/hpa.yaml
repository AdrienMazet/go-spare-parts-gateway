apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spare-parts-api
  namespace: spare-parts
  labels:
    app.kubernetes.io/name: spare-parts-api
    app.kubernetes.io/part-of: spare-parts-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spare-parts-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
