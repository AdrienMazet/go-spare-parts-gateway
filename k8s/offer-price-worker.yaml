apiVersion: apps/v1
kind: Deployment
metadata:
  name: offer-price-worker
  namespace: spare-parts
  labels:
    app.kubernetes.io/name: offer-price-worker
    app.kubernetes.io/part-of: spare-parts-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: offer-price-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offer-price-worker
        app.kubernetes.io/part-of: spare-parts-gateway
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 29096; do echo "waiting for kafka"; sleep 2; done
      containers:
        - name: offer-price-worker
          image: offer-price-worker:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9091
              name: metrics
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
