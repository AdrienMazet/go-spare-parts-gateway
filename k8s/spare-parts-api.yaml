apiVersion: apps/v1
kind: Deployment
metadata:
  name: spare-parts-api
  namespace: spare-parts
  labels:
    app.kubernetes.io/name: spare-parts-api
    app.kubernetes.io/part-of: spare-parts-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spare-parts-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spare-parts-api
        app.kubernetes.io/part-of: spare-parts-gateway
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 29096; do echo "waiting for kafka"; sleep 2; done
      containers:
        - name: spare-parts-api
          image: spare-parts-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: spare-parts-api
  namespace: spare-parts
  labels:
    app.kubernetes.io/name: spare-parts-api
    app.kubernetes.io/part-of: spare-parts-gateway
spec:
  selector:
    app.kubernetes.io/name: spare-parts-api
  ports:
    - port: 8080
      targetPort: http
      name: http
  type: ClusterIP
