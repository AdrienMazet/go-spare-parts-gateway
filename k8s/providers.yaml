apiVersion: apps/v1
kind: Deployment
metadata:
  name: atdistri
  namespace: spare-parts
  labels:
    app.kubernetes.io/name: atdistri
    app.kubernetes.io/part-of: spare-parts-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atdistri
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atdistri
        app.kubernetes.io/part-of: spare-parts-gateway
    spec:
      containers:
        - name: provider
          image: spare-parts-provider:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PROVIDER_NAME
              value: atdistri
            - name: PROVIDER_PORT
              value: "8081"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: atdistri
  namespace: spare-parts
  labels:
    app.kubernetes.io/name: atdistri
    app.kubernetes.io/part-of: spare-parts-gateway
spec:
  selector:
    app.kubernetes.io/name: atdistri
  ports:
    - port: 8081
      targetPort: http
      name: http
  type: ClusterIP

