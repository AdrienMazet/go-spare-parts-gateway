name: Go Spare Parts Gateway CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Tidy check, Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Tidy check
        run: make tidy-check

      - name: Build
        run: make build

      - name: Test
        run: make run-tests

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2