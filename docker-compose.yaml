services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  atdistri:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/provider
    environment:
      PROVIDER_NAME: atdistri
      PROVIDER_PORT: 8081
    ports:
      - "8081:8081"

  globalcar:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/provider
    environment:
      PROVIDER_NAME: globalcar
      PROVIDER_PORT: 8082
    ports:
      - "8082:8082"

  hexapart:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/provider
    environment:
      PROVIDER_NAME: hexapart
      PROVIDER_PORT: 8083
    ports:
      - "8083:8083"

  partspec:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/provider
    environment:
      PROVIDER_NAME: partspec
      PROVIDER_PORT: 8084
    ports:
      - "8084:8084"

volumes:
  postgres-data:
